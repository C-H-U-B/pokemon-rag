[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pokemon-rag"
version = "0.1.0"
description = "Local hybrid RAG and structured query system for Pokémon data"
requires-python = ">=3.10"

dependencies = [
    "openai",
    "langgraph",
    "google-adk==2.10.0",
    "litellm==1.103.2",
    "chromadb",
    "sentence-transformers",
    "rank-bm25",
    "numpy",
    "tqdm",
    "requests",
    "langchain-text-splitters",
    "pandas",
    "openpyxl",
    "mcp",
    "pytest",
    "gradio>=6.29,<7",
]

[project.optional-dependencies]
dev = ["ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
# Erreurs réelles seulement (imports inutilisés, noms indéfinis, redéfinitions).
# Aucun formatage n'est imposé au code existant.
select = ["F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: interaction entre plusieurs composants réels du projet",
    "real_data: nécessite les bases ou le corpus locaux du projet",
    "llm: nécessite le serveur LLM local",
    "models: charge les modèles d'embedding ou de reranking",
    "long: tests lents utilisant LLM, modèles locaux ou pipelines complets",
]
